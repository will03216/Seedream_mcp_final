[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedream-mcp"
version = "1.0.0"
description = "MCP server exposing BytePlus Seedream 4.5 / 5.0 Lite image generation to AI clients"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["byteplus", "seedream", "mcp", "image-generation", "ai"]
dependencies = [
    "seedream-sdk>=1.0.0",
    "mcp>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[project.urls]
Repository = "https://github.com/byteplus/byteplus-seedream"

[tool.hatch.build.targets.wheel]
packages = ["seedream_mcp"]

[tool.uv.workspace]
members = [
    "packages/seedream-sdk",
    "packages/seedream-mcp",
    "packages/seedream-cli",
]

# CI runs `uv sync --all-packages --dev`, and --dev resolves this PEP 735 group.
# The per-package [project.optional-dependencies] dev extras are NOT picked up by
# that flag, so the toolchain has to be declared here or `uv run ruff` finds
# nothing to spawn.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by formatter. B008: typer.Option()-in-defaults is the
# documented Typer idiom. B904: CLI commands surface a friendly message then
# `raise typer.Exit(1)`; chaining the original exception adds noise, not signal.
ignore = ["E501", "B008", "B904"]

[tool.ruff.isort]
known-first-party = ["seedream", "seedream_mcp", "seedream_cli"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/seedream-sdk/tests",
    "packages/seedream-mcp/tests",
    "packages/seedream-cli/tests",
]
